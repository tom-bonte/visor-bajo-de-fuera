[build]
  publish = "."
  command = ""

[build.environment]
  # La apiKey de Firebase es PÚBLICA por diseño: es un identificador de proyecto,
  # va dentro de config.js y se sirve al navegador en cualquier app web de Firebase.
  # Lo que protege los datos son las reglas de Firestore, no ocultar esa cadena.
  #
  # Si alguien la registra como variable de entorno en Netlify, el escáner de
  # secretos encuentra ese mismo valor dentro de config.js al desplegar y tumba
  # la compilación ("Exposed secrets detected"). Ya ocurrió el 20/09/2026.
  # Excluirla del escaneo deja el despliegue a salvo de ese error, sin bajar la
  # guardia con MAKE_WEBHOOK_URL, que sí es un secreto real y se sigue vigilando.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY"

  # config.js es, por definición, la configuración PÚBLICA del cliente: se
  # descarga entera en el navegador de cualquiera que abra el visor. El escáner
  # de secretos la señala por contener una cadena con forma de clave de Google.
  # Se excluye sólo ese fichero (y el proxy, que contiene la misma apiKey
  # pública); el resto del despliegue se sigue vigilando.
  SECRETS_SCAN_OMIT_PATHS = "config.js,netlify/functions/notify.js"

# Proxy autenticado hacia el webhook de WhatsApp (netlify/functions/notify.js).
# Requiere esta variable de entorno en Netlify → Site settings → Environment variables:
#   MAKE_WEBHOOK_URL   URL del webhook de Make.com (SECRETA: marcar "Contains secret values")
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
