[build]
  publish = "."
  command = ""

# Proxy autenticado hacia el webhook de WhatsApp (netlify/functions/notify.js).
# Requiere estas variables de entorno en Netlify → Site settings → Environment variables:
#   MAKE_WEBHOOK_URL   URL del webhook de Make.com (SECRETA: nunca en el código)
#   FIREBASE_API_KEY   apiKey del proyecto Firebase
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
