[build]
  publish = "."
  command = ""

# Proxy autenticado hacia el webhook de WhatsApp (netlify/functions/notify.js).
# Requiere esta variable de entorno en Netlify → Site settings → Environment variables:
#   MAKE_WEBHOOK_URL   URL del webhook de Make.com (SECRETA: marcar "Contains secret values")
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
